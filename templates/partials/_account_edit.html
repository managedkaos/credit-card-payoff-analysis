<li class="px-4 py-4 sm:px-6 bg-gray-50 border-y border-brand" id="account-edit-{{ account.id }}" data-account-type="{{ account.type }}" data-account-name="{{ account.name | lower }}">
    <form hx-post="/accounts/{{account.id}}/update" hx-target="#account-list" class="flex items-center justify-between w-full">
        <div class="flex items-center flex-1 pr-4">
            <span class="inline-flex items-center justify-center h-8 w-8 rounded-full {% if account.type == 'bank' %}bg-green-100{% elif account.type == 'loan' %}bg-amber-100{% else %}bg-purple-100{% endif %} ring-8 ring-transparent">
                {% if account.type == 'bank' %}
                    <svg class="h-5 w-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                {% elif account.type == 'loan' %}
                    <svg class="h-5 w-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                {% else %}
                    <svg class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                {% endif %}
            </span>
            <input type="text" name="name" value="{{ account.name }}" class="ml-4 flex-1 focus:ring-brand focus:border-brand block w-full shadow-sm sm:text-sm border-gray-300 rounded-md py-1.5 px-3 border border-gray-300" required>
        </div>
        <div class="flex items-center gap-2">
            <button type="submit" class="text-sm bg-brand text-white font-medium px-3 py-1.5 rounded hover:bg-blue-700 shadow-sm transition">Save</button>
            <button type="button" hx-get="/accounts" hx-target="#account-list" hx-select="#account-list > *" class="text-gray-500 hover:text-gray-700 text-sm font-medium transition cursor-pointer">Cancel</button>
        </div>
    </form>
</li>
