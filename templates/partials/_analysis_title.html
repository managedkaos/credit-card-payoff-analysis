<div id="analysis-title-container" class="group flex items-center gap-2">
    <form hx-post="/analyses/{{analysis.id}}/update_title" hx-target="#analysis-title-container" hx-swap="outerHTML" class="flex items-center gap-2 m-0 p-0">
        <input type="text" name="title" value="{{ analysis.title }}" class="text-3xl font-extrabold tracking-tight text-gray-900 border border-transparent bg-transparent hover:bg-gray-100 focus:bg-white rounded px-2 py-1 focus:ring-2 focus:ring-brand focus:border-brand transition inline-block min-w-[300px]" required>
        <button type="submit" class="text-sm bg-brand text-white font-medium px-3 py-1.5 rounded hover:bg-blue-700 shadow-sm transition opacity-0 group-hover:opacity-100 focus-within:opacity-100 whitespace-nowrap">Save Name</button>
    </form>
</div>
