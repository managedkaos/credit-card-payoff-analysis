<div class="bg-white shadow overflow-hidden sm:rounded-md">
    <ul role="list" class="divide-y divide-gray-200">
        {% for account in accounts %}
        <li class="px-4 py-4 sm:px-6 flex items-center justify-between" data-account-type="{{ account.type }}" data-account-name="{{ account.name | lower }}" data-index="{{ loop.index }}">
            <div class="flex items-center">
                <span class="inline-flex items-center justify-center h-8 w-8 rounded-full {{ 'bg-green-100' if account.type == 'bank' else 'bg-purple-100' }} ring-8 ring-white">
                    {% if account.type == 'bank' %}
                        <svg class="h-5 w-5 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    {% else %}
                        <svg class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                        </svg>
                    {% endif %}
                </span>
                <p class="ml-4 text-sm font-medium text-gray-900">{{ account.name }}</p>
            </div>
            <div class="flex items-center gap-4">
                <button hx-get="/accounts/{{account.id}}/edit" hx-target="closest li" hx-swap="outerHTML" class="text-brand hover:text-blue-700 text-sm font-medium transition cursor-pointer border border-brand/30 bg-blue-50/50 hover:bg-blue-100 px-3 py-1.5 rounded-md">
                    Edit
                </button>
                <button hx-post="/accounts/{{account.id}}/delete" hx-target="#account-list" hx-swap="innerHTML" class="text-red-500 hover:text-red-700 text-sm font-medium transition cursor-pointer border border-red-200 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-md">
                    Delete
                </button>
            </div>
        </li>
        {% else %}
        <li class="px-4 py-8 text-center text-gray-500 text-sm">
            No accounts added yet.
        </li>
        {% endfor %}
    </ul>
</div>
